name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -v
      - run: node --check desktop/plugin.js
      - run: node --test test_desktop.mjs
  macos-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -v
      - name: Compile macOS overlay helper
        run: |
          swiftc -parse-as-library native/macos_overlay.swift -o /tmp/meeting-copilot-overlay
          /tmp/meeting-copilot-overlay --self-test
      - run: node --check desktop/plugin.js
      - run: node --test test_desktop.mjs
