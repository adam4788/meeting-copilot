<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="650" viewBox="0 0 1440 650" role="img" aria-labelledby="title desc">
<title id="title">Meeting Copilot: four deliberate steps</title><desc id="desc">Choose project files, capture with permission, request a suggestion, then review the answer and evidence. Conceptual workflow, not a product screenshot.</desc>
<rect width="1440" height="650" fill="#F2F2F2"/>
<path d="M48 38H1392M48 612H1392" stroke="#0000F2"/>
<text x="56" y="84" fill="#0000F2" font-family="monospace" font-size="19" letter-spacing="3">MEETING COPILOT / THE WORKFLOW</text>
<text x="56" y="147" fill="#181818" font-family="Arial,sans-serif" font-size="42" font-weight="bold">Your context. Your model. Your decision.</text>
<rect x="56" y="205" width="640" height="168" rx="0" fill="white" stroke="#0000F2"/><rect x="56" y="205" width="72" height="168" fill="#0000F2"/><text x="74" y="256" font-family="monospace" font-size="28" fill="#F2F2F2">01</text><text x="156" y="252" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#181818">CHOOSE A PROJECT</text><text x="156" y="297" font-family="Arial,sans-serif" font-size="23" fill="#565656">Supported text files</text><text x="156" y="332" font-family="Arial,sans-serif" font-size="23" fill="#565656">become retrievable evidence.</text><rect x="744" y="205" width="640" height="168" rx="0" fill="white" stroke="#0000F2"/><rect x="744" y="205" width="72" height="168" fill="#0000F2"/><text x="762" y="256" font-family="monospace" font-size="28" fill="#F2F2F2">02</text><text x="844" y="252" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#181818">CAPTURE WITH CONSENT</text><text x="844" y="297" font-family="Arial,sans-serif" font-size="23" fill="#565656">Prepare your transcript source.</text><text x="844" y="332" font-family="Arial,sans-serif" font-size="23" fill="#565656">Start only with permission.</text><rect x="56" y="402" width="640" height="168" rx="0" fill="white" stroke="#0000F2"/><rect x="56" y="402" width="72" height="168" fill="#0000F2"/><text x="74" y="453" font-family="monospace" font-size="28" fill="#F2F2F2">03</text><text x="156" y="449" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#181818">ASK WHEN YOU NEED IT</text><text x="156" y="494" font-family="Arial,sans-serif" font-size="23" fill="#565656">Explicitly request a suggestion</text><text x="156" y="529" font-family="Arial,sans-serif" font-size="23" fill="#565656">from your selected model.</text><rect x="744" y="402" width="640" height="168" rx="0" fill="white" stroke="#0000F2"/><rect x="744" y="402" width="72" height="168" fill="#0000F2"/><text x="762" y="453" font-family="monospace" font-size="28" fill="#F2F2F2">04</text><text x="844" y="449" font-family="Arial,sans-serif" font-size="25" font-weight="bold" fill="#181818">REVIEW THE EVIDENCE</text><text x="844" y="494" font-family="Arial,sans-serif" font-size="23" fill="#565656">Read the answer and its sources.</text><text x="844" y="529" font-family="Arial,sans-serif" font-size="23" fill="#565656">Decide what to share yourself.</text></svg>